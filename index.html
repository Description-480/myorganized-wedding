    <!--
      SPA fallback restore (pairs with public/404.html). When a deep link was
      redirected via /?/<path>, rewrite the address bar back to the real path
      before the app boots so React Router sees the intended route.
    -->
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
