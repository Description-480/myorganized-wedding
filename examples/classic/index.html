<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!--
      SPA fallback restore (pairs with public/404.html). When a deep link was
      redirected via /?/<path>, rewrite the address bar back to the real path
      before the app boots so React Router sees the intended route.
    -->
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <title>My Organized Wedding — Share the load, not just the day</title>
    <meta
      name="description"
      content="The wedding coordination app for couples and everyone helping. Give every task an owner and a deadline, keep your helpers in the loop, and run the day itself without anyone asking where to be."
    />
    <link rel="canonical" href="https://myorganized.wedding/" />
