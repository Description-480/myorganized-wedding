<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Organized Wedding</title>
    <!--
      SPA fallback for GitHub Pages (rafgraph/spa-github-pages technique).
      GitHub serves this file for any unknown path. Instead of showing a 404,
      we encode the requested path into a query string and redirect to the app
      root (index.html), which returns HTTP 200. index.html's inline script then
      restores the real URL so client-side routing takes over seamlessly.
      pathSegmentsToKeep = 0 because the site is served from a custom apex domain.
    -->
    <script>
      (function () {
        var pathSegmentsToKeep = 0;
        var l = window.location;
        l.replace(
          l.protocol +
            "//" +
            l.hostname +
            (l.port ? ":" + l.port : "") +
            l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") +
            "/?/" +
            l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
            (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
            l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
